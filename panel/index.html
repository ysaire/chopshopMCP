  <header class="topBar">
    <div class="brand">chopshop<span>MCP</span></div>
    <div class="topRight">
      <div class="statusRow">
        <span class="led" title="premiere"><span class="dot" id="statusHost" title="premiere"></span>PR</span>
        <span class="led" title="python sidecar"><span class="dot" id="statusPython" title="python sidecar"></span>PY</span>
        <span class="led" title="claude bridge (mcp)"><span class="dot" id="statusBridge" title="claude bridge (mcp)"></span>MCP</span>
      </div>
      <button class="iconBtn" id="settingsBtn" title="Settings" aria-label="Settings" aria-pressed="false"><svg class="ico"><use href="#i-setting"/></svg></button>
    </div>
  </header>

  <main>
    <div id="mainView">
      <section class="card">
        <div class="rushRow">
          <select id="mediaSelect" aria-label="Rush"></select>
          <button class="iconBtn" id="browseBtn" title="Browse: pick the rush file yourself" aria-label="Browse"><svg class="ico"><use href="#i-folder"/></svg></button>
          <button class="iconBtn" id="refreshBtn" title="Refresh: re-read the selection in Premiere" aria-label="Refresh"><svg class="ico"><use href="#i-refresh"/></svg></button>
        </div>
        <div class="hint" id="mediaHint">Select a clip in the timeline or the project panel.</div>
      </section>

      <section class="card">
        <div class="chips" id="formatGroup" role="radiogroup" aria-label="Footage">
          <button data-format="unboxing" role="radio" title="Unboxing, desk setup, ASMR"><svg class="ico"><use href="#i-box"/></svg><span>Unboxing</span></button>
          <button data-format="gaming" role="radio" title="Gaming"><svg class="ico"><use href="#i-game"/></svg><span>Gaming</span></button>
          <button data-format="podcast" role="radio" title="Podcast, interview"><svg class="ico"><use href="#i-mic"/></svg><span>Podcast</span></button>
          <button data-format="core" role="radio" title="Other footage"><svg class="ico"><use href="#i-category"/></svg><span>Other</span></button>
        </div>
        <input id="goalInput" type="text" aria-label="What you want" placeholder="What you want: 45 s vertical flash edit + a long version">
        <button class="primary wide" id="analyzeBtn" title="Analyzes the rush locally once, then copies a prompt to paste in Claude Desktop"><svg class="ico"><use href="#i-scan"/></svg>Analyze for Claude</button>
      </section>

      <section class="tiles">
        <button class="tile" id="copyPromptBtn" title="Copy the prompt for Claude Desktop"><svg class="ico"><use href="#i-copy"/></svg><span>Copy prompt</span></button>
        <button class="tile" id="refineMaskBtn" title="Refine mask: sketch a pen mask on the clip's Mosaic or Gaussian Blur where the object is whole, set In and Out on the stretch to hide, select the clip, then click. The sketch becomes the object's silhouette on every frame."><svg class="ico"><use href="#i-magicpen"/></svg><span>Refine mask</span></button>
        <button class="tile" id="silencesBtn" title="Cut the dead air of the rush into a new sequence (settings: silence cut)"><svg class="ico"><use href="#i-scissor"/></svg><span>Cut silences</span></button>
        <button class="tile" id="clearMarkersBtn" title="Remove the review markers Claude put on the active timeline"><svg class="ico"><use href="#i-flag"/></svg><span>Clear markers</span></button>
      </section>
    </div>

    <div id="settingsView" hidden>
      <div class="viewHead">
        <button class="iconBtn" id="backBtn" title="Back" aria-label="Back"><svg class="ico"><use href="#i-back"/></svg></button>
        <div class="viewTitle">Settings</div>
      </div>

      <section class="card">
        <div class="cardTitle">Masks</div>
        <label for="maskModeSelect">Mode</label>
        <select id="maskModeSelect">
          <option value="native">Native, Premiere pen masks grafted into the project (editable)</option>
          <option value="matte">Mattes, Premiere composites the original (editable)</option>
          <option value="baked">Baked, pixels rendered by chopshopMCP</option>
        </select>
        <div class="grid">
          <label for="featherInput">Feather (px at 1080p)</label>
          <input id="featherInput" type="number" min="0" max="200" step="1">
          <label for="expansionInput">Expansion (px at 1080p)</label>
          <input id="expansionInput" type="number" min="-100" max="200" step="1">
        </div>
        <label for="cutoutSelect">Subject cutout</label>
        <select id="cutoutSelect">
          <option value="auto">Auto (fine edges on GPU)</option>
          <option value="best">Best, fine edges every frame</option>
          <option value="fast">Fast, coarse edges</option>
        </select>
      </section>

      <section class="card">
        <div class="cardTitle">Voice</div>
        <div class="grid">
          <label for="voiceTrackSelect">Voice track</label>
          <select id="voiceTrackSelect">
            <option value="1">A1</option>
            <option value="2">A2</option>
            <option value="3">A3</option>
            <option value="4">A4</option>
          </select>
          <label for="languageSelect">Language</label>
          <select id="languageSelect">
            <option value="auto">Auto</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
          </select>
          <label for="whisperSelect">Whisper</label>
          <select id="whisperSelect">
            <option value="auto">Auto (turbo on GPU, small on CPU)</option>
            <option value="large-v3-turbo">large-v3-turbo</option>
            <option value="large-v3">large-v3</option>
            <option value="medium">medium</option>
            <option value="small">small</option>
            <option value="base">base</option>
          </select>
        </div>
      </section>

      <section class="card">
        <div class="cardTitle">Silence cut</div>
        <div class="grid">
          <label for="padInput">Padding (ms)</label>
          <input id="padInput" type="number" min="0" max="500" step="10">
          <label for="minSilenceInput">Min silence (ms)</label>
          <input id="minSilenceInput" type="number" min="100" max="3000" step="50">
          <label for="thresholdInput">Threshold (dB)</label>
          <input id="thresholdInput" type="number" min="-80" max="-10" step="1" placeholder="auto">
        </div>
      </section>

      <section class="card">
        <div class="cardTitle">Graphics</div>
        <label for="accentText">Channel accent</label>
        <div class="accentRow">
          <input id="accentPicker" type="color" value="#ff5a36" aria-label="Pick the accent">
          <input id="accentText" type="text" maxlength="7" spellcheck="false" placeholder="template colours">
        </div>
        <div class="hint">Every motion graphic that takes an accent uses it. Empty: each template keeps its own.</div>
      </section>

      <section class="card">
        <div class="cardTitle">Python</div>
        <label for="pythonInput">Interpreter</label>
        <input id="pythonInput" type="text" spellcheck="false" placeholder="python">
        <div class="tiles three">
          <button class="tile" id="checkBtn" title="Check that every python module is installed"><svg class="ico"><use href="#i-tick"/></svg><span>Check setup</span></button>
          <button class="tile" id="diagnoseBtn" title="Copies a report to paste in a bug report"><svg class="ico"><use href="#i-clipboard"/></svg><span>Diagnose</span></button>
          <button class="tile" id="selfTestBtn" title="Imports a tiny test edit and checks every trick in this Premiere"><svg class="ico"><use href="#i-task"/></svg><span>Self-test</span></button>
        </div>
        <div class="hint" id="bridgeHint"></div>
      </section>
    </div>

    <section class="status" aria-live="polite">
      <div class="stageRow">
        <div class="stage" id="stageLabel">Idle</div>
        <button class="iconBtn small" id="cancelBtn" title="Stop" aria-label="Stop" hidden><svg class="ico"><use href="#i-stop"/></svg></button>
      </div>
      <div class="progress"><div class="bar" id="progressBar"></div></div>
      <div class="result" id="resultBox" hidden></div>
    </section>

    <pre class="log" id="logBox"></pre>
  </main>

  <script src="js/cep.js"></script>
  <script src="js/bridgeServer.js"></script>
  <script src="js/sidecar.js"></script>
  <script src="js/selfTest.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
