<!doctype html>
<html lang="fr" data-composition-variables='[
  {"id":"name","type":"string","label":"Product name","default":"Product name"},
  {"id":"detail","type":"string","label":"One line under the name, empty for none","default":"Tempered glass · 490 × 420 mm"},
  {"id":"side","type":"string","label":"left or right","default":"left"},
  {"id":"accent","type":"color","label":"Accent colour","default":"#ff5a36"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<meta name="description" content="Lower third: the product name on a solid panel with an accent bar, one line of detail under it, low in the frame on the left or the right. Wipes in from its bar, holds, wipes back." />
<link rel="stylesheet" href="chop.css" />
<script src="gsap.min.js"></script>
<script src="chop.js"></script>
<style>
  #card { position: absolute; left: var(--sx); bottom: var(--sb); display: flex; align-items: stretch; }
  #card.right { left: auto; right: var(--sx); flex-direction: row-reverse; text-align: right; }
  #bar { width: calc(10 * var(--u)); background: var(--accent); transform-origin: 50% 100%; }
  #panel { padding: calc(24 * var(--u)) calc(42 * var(--u)) calc(26 * var(--u)) calc(30 * var(--u)); }
  #card.right #panel { padding: calc(24 * var(--u)) calc(30 * var(--u)) calc(26 * var(--u)) calc(42 * var(--u)); }
  #name { font-size: calc(62 * var(--u)); font-weight: 700; letter-spacing: -0.01em; line-height: 1.08; }
  #detail { font-size: calc(30 * var(--u)); color: var(--muted); margin-top: calc(6 * var(--u)); line-height: 1.2; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
  <div id="scene" class="clip" data-start="0" data-duration="4">
    <div id="card">
      <div id="bar"></div>
      <div id="panel" class="panel">
        <div class="mask"><span id="name"></span></div>
        <div class="mask" id="detailLine"><span id="detail"></span></div>
      </div>
    </div>
  </div>
</div>
<script>
  const k = chop();
  const right = k.vars.side === "right";
  document.getElementById("card").classList.toggle("right", right);
  k.text("name", k.vars.name);
  k.text("detail", k.vars.detail);
  if (!k.vars.detail) document.getElementById("detailLine").style.display = "none";
  const shut = right ? "inset(0% 0% 0% 100%)" : "inset(0% 100% 0% 0%)";
  const out = Math.max(1.2, k.D - 0.5);
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#bar", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "expo.out" }, 0);
  tl.fromTo("#panel", { clipPath: shut }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power4.out" }, 0.12);
  tl.fromTo("#name", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, 0.24);
  tl.fromTo("#detail", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, 0.36);
  tl.to(["#name", "#detail"], { yPercent: -110, duration: 0.28, ease: "power2.in", stagger: 0.05 }, out);
  tl.to("#panel", { clipPath: shut, duration: 0.32, ease: "power3.in" }, out + 0.12);
  tl.to("#bar", { scaleY: 0, duration: 0.2, ease: "power2.in" }, out + 0.3);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
