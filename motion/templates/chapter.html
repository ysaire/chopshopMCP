<!doctype html>
<html lang="fr" data-composition-variables='[
  {"id":"index","type":"string","label":"Chapter number, empty for none","default":"02"},
  {"id":"title","type":"string","label":"Chapter title, a few words","default":"Sound test"},
  {"id":"subtitle","type":"string","label":"One line under the title, empty for none","default":""},
  {"id":"accent","type":"color","label":"Accent colour","default":"#ff5a36"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<meta name="description" content="Chapter title: the chapter number in the accent colour and the title in big condensed capitals on a solid block, left of centre. The block wipes in, the letters rise one by one, the block wipes out. Between the parts of a video." />
<link rel="stylesheet" href="chop.css" />
<script src="gsap.min.js"></script>
<script src="chop.js"></script>
<style>
  #block { position: absolute; left: var(--sx); top: 50%; transform: translateY(-50%); display: flex; align-items: center;
           gap: calc(34 * var(--u)); padding: calc(26 * var(--u)) calc(52 * var(--u)) calc(30 * var(--u)) calc(40 * var(--u)); }
  #index { font-size: calc(132 * var(--u)); font-weight: 700; color: var(--accent); line-height: 1; font-stretch: 75%; }
  #rule { align-self: stretch; width: calc(5 * var(--u)); background: var(--accent); transform-origin: 50% 0; }
  #text { display: flex; flex-direction: column; }
  #title { font-size: calc(118 * var(--u)); font-weight: 700; text-transform: uppercase; line-height: 1; font-stretch: 75%;
           letter-spacing: 0.01em; white-space: nowrap; }
  #title .ch { display: inline-block; white-space: pre; }
  #subtitle { font-size: calc(34 * var(--u)); color: var(--muted); margin-top: calc(12 * var(--u)); }
  #block.vertical { left: var(--sx); right: var(--sx); flex-direction: column; align-items: flex-start; gap: calc(18 * var(--u)); }
  #block.vertical #rule { display: none; }
  #block.vertical #title { white-space: normal; font-size: calc(104 * var(--u)); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.5" data-width="1920" data-height="1080">
  <div id="scene" class="clip" data-start="0" data-duration="2.5">
    <div id="block" class="panel">
      <div class="mask" id="indexBox"><span id="index"></span></div>
      <div id="rule"></div>
      <div id="text">
        <div class="mask"><span id="title"></span></div>
        <div class="mask" id="subtitleBox"><span id="subtitle"></span></div>
      </div>
    </div>
  </div>
</div>
<script>
  const k = chop();
  document.getElementById("block").classList.toggle("vertical", k.vertical);
  k.text("index", k.vars.index);
  k.text("subtitle", k.vars.subtitle);
  if (!k.vars.index) { document.getElementById("indexBox").style.display = "none"; document.getElementById("rule").style.display = "none"; }
  if (!k.vars.subtitle) document.getElementById("subtitleBox").style.display = "none";
  const title = document.getElementById("title");
  Array.from(String(k.vars.title || "")).forEach((c) => {
    const s = document.createElement("span");
    s.className = "ch";
    s.textContent = c;
    title.appendChild(s);
  });
  const out = Math.max(1.3, k.D - 0.45);
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#block", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "expo.out" }, 0);
  tl.fromTo("#rule", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.12);
  tl.fromTo("#index", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, 0.14);
  tl.fromTo("#title .ch", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power3.out", stagger: 0.022 }, 0.2);
  tl.fromTo("#subtitle", { yPercent: 105 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, 0.45);
  tl.to("#block", { clipPath: "inset(0% 0% 0% 100%)", duration: 0.4, ease: "expo.in" }, out);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
