<!doctype html>
<html lang="fr" data-composition-variables='[
  {"id":"x","type":"number","label":"Point, 0 left to 1 right of the frame","default":0.5},
  {"id":"y","type":"number","label":"Point, 0 top to 1 bottom of the frame","default":0.5},
  {"id":"label","type":"string","label":"What the point is","default":"Bevelled edges"},
  {"id":"detail","type":"string","label":"One line under the label, empty for none","default":""},
  {"id":"accent","type":"color","label":"Accent colour","default":"#ff5a36"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<meta name="description" content="Callout: a dot with a pulse on one point of the frame (x, y from 0 to 1), a leader line, and a label on a solid panel. The line leaves towards the roomier side of the frame. For a part of the product that does not move during the graphic." />
<link rel="stylesheet" href="chop.css" />
<script src="gsap.min.js"></script>
<script src="chop.js"></script>
<style>
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #dot, #ring { position: absolute; border-radius: 50%; }
  #dot { width: calc(22 * var(--u)); height: calc(22 * var(--u)); background: var(--accent); border: calc(4 * var(--u)) solid var(--paper); }
  #ring { width: calc(22 * var(--u)); height: calc(22 * var(--u)); border: calc(3 * var(--u)) solid var(--accent); opacity: 0; }
  #tag { position: absolute; padding: calc(16 * var(--u)) calc(26 * var(--u)) calc(18 * var(--u)); white-space: nowrap;
         border-left: calc(6 * var(--u)) solid var(--accent); }
  #tag.flip { border-left: 0; border-right: calc(6 * var(--u)) solid var(--accent); text-align: right; }
  #label { font-size: calc(40 * var(--u)); font-weight: 700; }
  #detail { font-size: calc(26 * var(--u)); color: var(--muted); margin-top: calc(4 * var(--u)); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
  <div id="scene" class="clip" data-start="0" data-duration="4">
    <svg><path id="lead" fill="none" stroke-linecap="round" /></svg>
    <div id="ring"></div>
    <div id="dot"></div>
    <div id="tag" class="panel">
      <div class="mask"><span id="label"></span></div>
      <div class="mask" id="detailBox"><span id="detail"></span></div>
    </div>
  </div>
</div>
<script>
  const k = chop();
  const u = Math.min(k.W, k.H) / 1080;
  const px = Math.min(Math.max(Number(k.vars.x), 0), 1) * k.W;
  const py = Math.min(Math.max(Number(k.vars.y), 0), 1) * k.H;
  k.text("label", k.vars.label);
  k.text("detail", k.vars.detail);
  if (!k.vars.detail) document.getElementById("detailBox").style.display = "none";
  const dx = px < k.W * 0.6 ? 1 : -1;
  const dy = py > k.H * 0.35 ? -1 : 1;
  const diag = 90 * u;
  const run = 110 * u;
  const ex = px + dx * (diag + run);
  const ey = py + dy * diag;
  const lead = document.getElementById("lead");
  lead.setAttribute("d", `M ${px} ${py} L ${px + dx * diag} ${ey} L ${ex} ${ey}`);
  lead.setAttribute("stroke", getComputedStyle(document.documentElement).getPropertyValue("--paper").trim() || "#f5f5f7");
  lead.setAttribute("stroke-width", 4 * u);
  const length = diag * Math.SQRT2 + run;
  lead.style.strokeDasharray = length;
  for (const id of ["dot", "ring"]) {
    const el = document.getElementById(id);
    el.style.left = px - 11 * u + "px";
    el.style.top = py - 11 * u + "px";
  }
  const tag = document.getElementById("tag");
  tag.classList.toggle("flip", dx < 0);
  const margin = 24 * u;
  const tw = tag.offsetWidth;
  const th = tag.offsetHeight;
  let left = dx > 0 ? ex + 8 * u : ex - 8 * u - tw;
  left = Math.min(Math.max(left, margin), k.W - tw - margin);
  tag.style.left = left + "px";
  tag.style.top = Math.min(Math.max(ey - th / 2, margin), k.H - th - margin) + "px";
  const shut = dx > 0 ? "inset(0% 100% 0% 0%)" : "inset(0% 0% 0% 100%)";
  const out = Math.max(1.6, k.D - 0.6);
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 0);
  for (let t = 0.2; t < out - 0.6; t += 1.1) {
    tl.fromTo("#ring", { scale: 1, opacity: 0.9 }, { scale: 3.2, opacity: 0, duration: 1, ease: "power2.out", immediateRender: false }, t);
  }
  tl.fromTo(lead, { strokeDashoffset: length }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 0.15);
  tl.fromTo(tag, { clipPath: shut }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power4.out" }, 0.5);
  tl.fromTo(["#label", "#detail"], { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 0.6);
  tl.to(["#label", "#detail"], { yPercent: -110, duration: 0.25, ease: "power2.in", stagger: 0.04 }, out);
  tl.to(tag, { clipPath: shut, duration: 0.28, ease: "power3.in" }, out + 0.12);
  tl.to(lead, { strokeDashoffset: length, duration: 0.3, ease: "power2.in" }, out + 0.25);
  tl.to("#dot", { scale: 0, duration: 0.2, ease: "power2.in" }, out + 0.4);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
